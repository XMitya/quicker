<!--
  Plugin icon, light theme. 40x40 is the size the IDE and the Marketplace ask for; everything else
  is downscaled from it, so the mark carries at 20x20 too: one silhouette, one accent, no text.

  A leaf, after the Spring emblem the plugin is about, with its midrib drawn as a route that
  terminates in a node — a URL path and the endpoint at the end of it, which is what the plugin
  finds. Original geometry, not the Spring mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
    <path d="M36.1 3.9 C36.1 24.6 25.8 36.1 13.1 36.1 C7.4 36.1 3.9 31.5 3.9 25.8 C3.9 14.3 16.6 3.9 36.1 3.9 Z"
          fill="#6DB33F"/>
    <path d="M9.4 31 C12.6 21.6 17.4 16.4 22.2 14.1"
          fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    <!--
      A ring rather than a filled dot: filled reads as a map pin, and rather than a target with a
      core, whose core is the first thing to disappear under ~28px.
    -->
    <circle cx="27" cy="12" r="4.5" fill="none" stroke="#fff" stroke-width="2.6"/>
</svg>
